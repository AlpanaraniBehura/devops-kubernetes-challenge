name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        shell: powershell
        run: |
          $IMAGE="ghcr.io/${{ github.repository }}".ToLowerInvariant() + "/api:latest"
          docker build -t $IMAGE ./app
          echo "IMAGE=$IMAGE" >> $env:GITHUB_ENV

      - name: Push Docker image
        shell: powershell
        run: |
          docker push $env:IMAGE

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl set image deployment/api `
            api=$env:IMAGE `
            -n devops

          kubectl rollout status deployment/api `
            -n devops `
            --timeout=120s