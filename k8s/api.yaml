apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devops
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: devops-api:local

          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: appdb

            - name: DB_USER
              value: appuser

            - name: DB_PASSWORD
              value: password

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devops

spec:
  selector:
    app: api

  ports:
    - port: 80
      targetPort: 8000

  type: ClusterIP